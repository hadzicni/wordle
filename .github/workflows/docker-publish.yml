name: Build & Push Docker Image to Registry

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  IMAGE: registry.svc.home.arpa/wordle

jobs:
  build-and-push:
    runs-on: [self-hosted, homelab]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.svc.home.arpa
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # `.git` is excluded from the Docker build context, so the commit and the
      # timestamp are handed to the build instead of read from the repository.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_COMMIT="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
